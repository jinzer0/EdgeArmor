<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdgeArmor</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-name">EdgeArmor</span>
          <span class="brand-badge">Forensic Scan</span>
        </div>
        <span id="timing-chip" class="timing-chip">idle</span>
      </header>

      <section class="control-panel">
        <label class="dropzone" for="image-input" tabindex="0">
          <div class="dropzone-content">
            <span class="dropzone-title">이미지 선택</span>
            <span class="dropzone-meta">JPEG, PNG, WEBP</span>
          </div>
        </label>
        <input id="image-input" type="file" accept="image/*" hidden />
        
        <div class="actions">
          <button id="analyze-button" class="btn-primary" type="button" disabled>분석 실행</button>
          <button id="reset-button" class="btn-secondary" type="button">초기화</button>
        </div>
        <div class="status-bar">
          <p id="status-text" class="status-text">브라우저에서 ONNX detector + classifier로 바로 분석합니다.</p>
        </div>
      </section>

      <section class="analysis-grid">
        <div class="preview-container">
          <canvas id="preview-canvas" class="preview-canvas" width="640" height="640"></canvas>
        </div>

        <div class="results-container">
          <div id="summary-panel" class="summary-panel empty">
            <p class="summary-title">아직 분석 결과가 없습니다.</p>
            <p class="summary-copy">이미지를 추가하면 얼굴별 점수와 최종 이미지 판정이 표시됩니다.</p>
          </div>
          <div id="face-list" class="face-list"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
